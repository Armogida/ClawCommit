name: 'ClawCommit - AI Decision Audit'
description: 'Commit and optionally reveal AI decisions to BNB Chain using the ClawCommit protocol'
branding:
  icon: 'lock'
  color: 'blue'

inputs:
  action:
    description: 'Action to perform: commit, reveal, or verify'
    required: true
  prompt:
    description: 'Prompt/context used to generate the AI decision'
    required: false
  output:
    description: 'AI model output/decision string'
    required: false
  model-version:
    description: 'Model version used to generate the output'
    required: false
  nonce:
    description: 'Nonce for commit/reveal (auto-generated if omitted for commit)'
    required: false
  commit-id:
    description: 'Commit ID for reveal/verify operations'
    required: false
  contract-address:
    description: 'ClawCommit contract address on BSC'
    required: true
  rpc-url:
    description: 'BSC RPC URL'
    required: false
    default: 'https://bsc-dataseed.binance.org/'
  allow-mainnet-writes:
    description: 'Set to true to allow commit/reveal writes on BSC mainnet (chainId 56)'
    required: false
    default: 'false'
  log-sensitive:
    description: 'Set to true to log prompt/output/nonce values'
    required: false
    default: 'false'
  private-key:
    description: 'Deployer private key (use GitHub Secrets)'
    required: false

outputs:
  commit-id:
    description: 'The commit ID from a commit operation'
  hash:
    description: 'The deterministic decision hash'
  nonce:
    description: 'The nonce used'
  tx-hash:
    description: 'Transaction hash'
  verified:
    description: 'Verification result (true/false)'

runs:
  using: 'node20'
  main: 'index.js'
