# Example: Verify AI Decision Integrity
# This workflow verifies that a commitment hasn't been tampered with

name: Verify AI Decision

on:
  workflow_dispatch:
    inputs:
      commit-id:
        description: 'Commit ID to verify'
        required: true
        type: string
  schedule:
    # Run verification every Monday at 9 AM UTC
    - cron: '0 9 * * 1'

jobs:
  verify-single:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Verify Commitment
        id: verify
        uses: Armogida/ClawCommit/integrations/github-action@main
        with:
          action: verify
          commit-id: ${{ github.event.inputs.commit-id }}
          contract-address: ${{ secrets.CLAWCOMMIT_CONTRACT }}

      - name: Check Verification Result
        run: |
          if [ "${{ steps.verify.outputs.verified }}" == "true" ]; then
            echo "✓ Commitment ${{ github.event.inputs.commit-id }} verified successfully"
            echo "Hash: ${{ steps.verify.outputs.hash }}"
          else
            echo "✗ Commitment ${{ github.event.inputs.commit-id }} verification FAILED"
            exit 1
          fi

      - name: Create Issue on Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 AI Decision Verification Failed',
              body: `Commitment ID ${{ github.event.inputs.commit-id }} failed verification.

              This may indicate:
              - Data tampering
              - Contract corruption
              - Network issues

              **Immediate investigation required!**

              Hash: \`${{ steps.verify.outputs.hash }}\`
              `,
              labels: ['security', 'urgent']
            });

  verify-batch:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Add your commit IDs to verify regularly
        commit-id: [1, 2, 3, 4, 5]
      fail-fast: false

    steps:
      - name: Verify Commitment
        id: verify
        uses: Armogida/ClawCommit/integrations/github-action@main
        with:
          action: verify
          commit-id: ${{ matrix.commit-id }}
          contract-address: ${{ secrets.CLAWCOMMIT_CONTRACT }}
        continue-on-error: true

      - name: Log Verification Result
        run: |
          if [ "${{ steps.verify.outputs.verified }}" == "true" ]; then
            echo "✓ Commitment ${{ matrix.commit-id }}: VALID"
          else
            echo "✗ Commitment ${{ matrix.commit-id }}: INVALID"
          fi

      - name: Report Failure
        if: steps.verify.outputs.verified != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 Scheduled Verification Failed: Commit ${matrix.commit-id}`,
              body: `Weekly verification detected an issue with commitment ID ${matrix.commit-id}.

              **Status**: Failed
              **Time**: ${new Date().toISOString()}

              Please investigate immediately.
              `,
              labels: ['security', 'automated']
            });
