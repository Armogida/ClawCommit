name: Gemini PR Audit (ClawCommit)

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  audit:
    if: ${{ github.event.pull_request.head.repo.fork == false }}
    runs-on: ubuntu-latest

    env:
      NETWORK: bscTestnet
      RPC_URL: ${{ secrets.BSC_TESTNET_RPC_URL }}
      CONTRACT: ${{ secrets.CLAWCOMMIT_CONTRACT_TESTNET }}
      DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY_TESTNET }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ALLOW_MAINNET_WRITES: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Local validation gates
        run: |
          npm run check:node
          npm run mcp:test

      - name: Gather PR context
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          mkdir -p .clawcommit/gemini
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=200" --jq '.[].filename' > .clawcommit/gemini/changed-files.txt

      - name: Run Gemini audit and emit OpenClaw decision log
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          node - <<'NODE'
          (async () => {
            const fs = require("fs");
            const path = require("path");
            const crypto = require("crypto");

            const apiKey = process.env.GEMINI_API_KEY || "";
            if (!apiKey) {
              throw new Error("Missing GEMINI_API_KEY secret");
            }

            const prNumber = process.env.PR_NUMBER;
            const prTitle = process.env.PR_TITLE || "";
            const prBody = process.env.PR_BODY || "";
            const changedFiles = fs.existsSync(".clawcommit/gemini/changed-files.txt")
              ? fs.readFileSync(".clawcommit/gemini/changed-files.txt", "utf8").trim().split(/\r?\n/).filter(Boolean)
              : [];

            const prompt = [
              "You are a strict repository auditor.",
              "Return first line EXACTLY as OPENCLAW_APPROVE or OPENCLAW_REJECT.",
              "Then provide 3 short bullet points with rationale.",
              "",
              `Repository: ${process.env.GITHUB_REPOSITORY}`,
              `PR: #${prNumber}`,
              `Title: ${prTitle}`,
              "Body:",
              prBody,
              "",
              "Changed files:",
              changedFiles.slice(0, 200).map((entry) => `- ${entry}`).join("\n"),
            ].join("\n").slice(0, 45000);

            const generationConfig = {
              temperature: 0.2,
              topP: 0.95,
              candidateCount: 1,
              stopSequences: ["END_AUDIT"],
            };

            const safetySettings = [
              { category: "HARM_CATEGORY_HATE_SPEECH", threshold: "BLOCK_MEDIUM_AND_ABOVE" },
              { category: "HARM_CATEGORY_DANGEROUS_CONTENT", threshold: "BLOCK_MEDIUM_AND_ABOVE" },
            ];

            const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-pro:generateContent?key=${encodeURIComponent(apiKey)}`;
            const response = await fetch(endpoint, {
              method: "POST",
              headers: { "content-type": "application/json" },
              body: JSON.stringify({
                contents: [{ role: "user", parts: [{ text: prompt }] }],
                generationConfig,
                safetySettings,
              }),
            });

            if (!response.ok) {
              const body = await response.text();
              throw new Error(`Gemini API error: ${response.status} ${body}`);
            }

            const payload = await response.json();
            const outputText =
              payload?.candidates?.[0]?.content?.parts?.map((part) => part?.text || "").join("\n").trim() ||
              "OPENCLAW_REJECT\n- Gemini returned an empty audit response.";

            const decision = outputText.startsWith("OPENCLAW_REJECT")
              ? "OPENCLAW_REJECT"
              : "OPENCLAW_APPROVE";

            const log = {
              provider: "gemini",
              sessionId: `gemini-pr-${prNumber}-${process.env.GITHUB_RUN_ID}`,
              agentId: "gemini-pr-audit-workflow",
              eventType: "PR_AUDIT",
              timestamp: new Date().toISOString(),
              prompt,
              output: `${decision}\n${outputText}`,
              modelVersion: "gemini-1.5-pro",
              nonce: "0x" + crypto.randomBytes(32).toString("hex"),
              generationConfig: {
                temperature: generationConfig.temperature,
                topP: generationConfig.topP,
                candidateCount: generationConfig.candidateCount,
                stopSequences: generationConfig.stopSequences,
                safetySettings,
              },
              metadata: {
                repository: process.env.GITHUB_REPOSITORY,
                actor: process.env.GITHUB_ACTOR,
                ref: process.env.GITHUB_REF,
                sha: process.env.GITHUB_SHA,
                prNumber,
                runId: process.env.GITHUB_RUN_ID,
                runUrl: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
                changedFileCount: changedFiles.length,
                validations: [
                  { name: "check:node", passed: true, required: true },
                  { name: "mcp:test", passed: true, required: true },
                ],
              },
            };

            const outFile = path.resolve(`.clawcommit/gemini/pr-${prNumber}-run.json`);
            fs.writeFileSync(outFile, JSON.stringify(log, null, 2) + "\n", "utf8");
            console.log(`Wrote ${outFile}`);
          })().catch((error) => {
            console.error(error.message || error);
            process.exit(1);
          });
          NODE

      - name: Convert OpenClaw log to ClawCommit decision
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          node integrations/openclaw/convert-to-clawcommit.js \
            --input ".clawcommit/gemini/pr-${PR_NUMBER}-run.json" \
            --out ".clawcommit/gemini/pr-${PR_NUMBER}-decision.json"

      - name: Commit/Reveal/Replay on BSC testnet and post PR links
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          npm run openclaw:attest -- \
            --repo "$GITHUB_WORKSPACE" \
            --network "$NETWORK" \
            --rpc "$RPC_URL" \
            --contract "$CONTRACT" \
            --decision-json ".clawcommit/gemini/pr-${PR_NUMBER}-decision.json" \
            --json-out ".clawcommit/gemini/pr-${PR_NUMBER}.json" \
            --json-include-prompt \
            --links-out ".clawcommit/gemini/pr-${PR_NUMBER}.md" \
            --links-title "Gemini PR Audit Attestation" \
            --post-gh-pr "${PR_NUMBER}" \
            --gh-repo "${GITHUB_REPOSITORY}"

      - name: Upload Gemini attestation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: clawcommit-gemini-pr-${{ github.event.pull_request.number }}
          path: .clawcommit/gemini/
