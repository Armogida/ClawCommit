name: ClawCommit CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  contract-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Enforce Node version
        run: npm run check:node

      - name: Install dependencies
        run: npm ci

      - name: Compile contracts
        run: npm run compile

      - name: Run tests
        run: npm test

      - name: Run tests with gas report
        run: REPORT_GAS=true npm test
        env:
          REPORT_GAS: 'true'

      - name: Run coverage
        run: npm run coverage

  integration-sdk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: integrations/sdk/package-lock.json

      - name: Enforce Node version
        run: npm run check:node

      - name: Install SDK dependencies
        run: npm ci --prefix integrations/sdk

      - name: SDK typecheck
        run: npm run typecheck --prefix integrations/sdk

      - name: SDK build
        run: npm run build --prefix integrations/sdk

      - name: SDK runtime tests
        run: npm test --prefix integrations/sdk

  integration-github-action:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: integrations/github-action/package-lock.json

      - name: Enforce Node version
        run: npm run check:node

      - name: Install GitHub Action dependencies
        run: npm ci --prefix integrations/github-action

      - name: Validate GitHub Action scripts
        run: |
          node --check integrations/github-action/index.js
          node --check integrations/github-action/test-local.js

      - name: Run GitHub Action unit tests
        run: npm test --prefix integrations/github-action

  integration-mcp-server:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: integrations/mcp-server/package-lock.json

      - name: Enforce Node version
        run: npm run check:node

      - name: Install MCP dependencies
        run: npm ci --prefix integrations/mcp-server

      - name: Validate MCP scripts
        run: |
          node --check integrations/mcp-server/index.js
          node --check integrations/mcp-server/test-tools.js

      - name: Run MCP unit tests
        run: npm test --prefix integrations/mcp-server

  security-audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Enforce Node version
        run: npm run check:node

      - name: Install root dependencies
        run: npm ci

      - name: Audit root runtime dependencies
        run: npm audit --omit=dev

      - name: Install SDK dependencies
        run: npm ci --prefix integrations/sdk

      - name: Audit SDK dependencies
        run: npm audit --prefix integrations/sdk

      - name: Install GitHub Action dependencies
        run: npm ci --prefix integrations/github-action

      - name: Audit GitHub Action dependencies
        run: npm audit --prefix integrations/github-action

      - name: Install MCP server dependencies
        run: npm ci --prefix integrations/mcp-server

      - name: Audit MCP server dependencies
        run: npm audit --prefix integrations/mcp-server

  integration-testnet-e2e:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' && secrets.E2E_TESTNET_RPC_URL != '' && secrets.E2E_TESTNET_CONTRACT_ADDRESS != '' && secrets.E2E_TESTNET_PRIVATE_KEY != '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Enforce Node version
        run: npm run check:node

      - name: Install root dependencies
        run: npm ci

      - name: Install SDK dependencies
        run: npm ci --prefix integrations/sdk

      - name: Build SDK
        run: npm run build --prefix integrations/sdk

      - name: Install GitHub Action dependencies
        run: npm ci --prefix integrations/github-action

      - name: Install MCP dependencies
        run: npm ci --prefix integrations/mcp-server

      - name: Run testnet end-to-end flow
        env:
          TESTNET_RPC_URL: ${{ secrets.E2E_TESTNET_RPC_URL }}
          TESTNET_CONTRACT_ADDRESS: ${{ secrets.E2E_TESTNET_CONTRACT_ADDRESS }}
          TESTNET_PRIVATE_KEY: ${{ secrets.E2E_TESTNET_PRIVATE_KEY }}
        run: node scripts/integration/testnet-e2e.js
